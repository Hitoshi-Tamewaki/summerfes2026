<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Web Audio API Gain & Meter Sample</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    .control-panel { margin-bottom: 20px; }
    .meter-container {
      width: 300px;
      height: 20px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.05s ease, background-color 0.1s;
    }
  </style>
</head>
<body>

  <h2>マイク音量増幅 ＆ レベルメーター</h2>

  <div class="control-panel">
    <button id="startBtn">マイク開始</button>
    <button id="stopBtn" disabled>停止</button>
  </div>

  <div class="control-panel">
    <label for="gainRange">Gain（増幅率）: <span id="gainVal">1.5</span>倍</label><br>
    <input type="range" id="gainRange" min="0" max="5" step="0.1" value="1.5">
  </div>

  <div>
    <label>入力レベル:</label>
    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let mediaStream = null;
    let gainNode = null;
    let analyserNode = null;
    let animationId = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const gainRange = document.getElementById('gainRange');
    const gainVal = document.getElementById('gainVal');
    const meterBar = document.getElementById('meterBar');

    // Gain（音量倍率）の変更をリアルタイム反映
    gainRange.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      gainVal.textContent = val.toFixed(1);
      if (gainNode) {
        gainNode.gain.value = val;
      }
    });

    startBtn.addEventListener('click', async () => {
      try {
        // 1. マイクの入力ストリームを取得
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            autoGainControl: false, // OS/ブラウザの自動感度調整をOFFにして手動制御する
            echoCancellation: true,
            noiseSuppression: false
          }
        });

        // 2. AudioContextと各ノードの生成
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(mediaStream);

        gainNode = audioCtx.createGain();
        gainNode.gain.value = parseFloat(gainRange.value); // 初期音量

        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 256;

        // 3. パイプライン接続: Source -> Gain -> Analyser
        // ※スピーカー出力（audioCtx.destination）へ接続するとハウリングするためあえて未接続にしています
        source.connect(gainNode);
        gainNode.connect(analyserNode);

        // 4. メーター更新ループ開始
        updateMeter();

        startBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (err) {
        alert('マイクの開始に失敗しました: ' + err.message);
      }
    });

    stopBtn.addEventListener('click', () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (audioCtx) {
        audioCtx.close();
      }
      cancelAnimationFrame(animationId);
      meterBar.style.width = '0%';
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    // 5. 振幅データから音量（RMS）を計算して表示する関数
    function updateMeter() {
      const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteTimeDomainData(dataArray);

      // 時間軸データの各サンプル値からRMS（二乗平均平方根）を計算
      let sumSquares = 0;
      for (let i = 0; i < dataArray.length; i++) {
        // 128を中心（無音）とした -1.0 〜 1.0 の範囲に正規化
        const norm = (dataArray[i] - 128) / 128;
        sumSquares += norm * norm;
      }
      const rms = Math.sqrt(sumSquares / dataArray.length);

      // メーターのパーセンテージ計算（RMS値に係数を掛けて感度調整）
      const level = Math.min(100, Math.round(rms * 250));
      meterBar.style.width = level + '%';

      // 90%以上の過大入力（音割れリスク）時は赤色に変更
      if (level > 90) {
        meterBar.style.background = '#f44336';
      } else {
        meterBar.style.background = '#4caf50';
      }

      animationId = requestAnimationFrame(updateMeter);
    }
  </script>
</body>
</html>
